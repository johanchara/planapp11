<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falcon Farms — Plan de Producción</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --navy: #1F3864;
    --navy-light: #2E4F8A;
  }
  body {
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .top-bar {
    background: var(--navy);
    color: #fff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .top-bar h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.5px;
  }
  .top-bar small {
    color: #a8c0e8;
    font-size: 0.85rem;
  }
  .login-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }
  .login-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
  }
  .login-card h2 {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 6px;
  }
  .login-card .sub {
    color: #6c757d;
    font-size: 0.9rem;
    margin-bottom: 28px;
  }
  .btn-login {
    background: var(--navy);
    border: none;
    color: #fff;
    font-weight: 600;
    padding: 10px;
    border-radius: 6px;
    width: 100%;
    font-size: 1rem;
    transition: background 0.2s;
  }
  .btn-login:hover { background: var(--navy-light); }
  .form-control:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 0.2rem rgba(31,56,100,0.15);
  }
  .alert-box {
    display: none;
    margin-top: 14px;
  }
  footer {
    text-align: center;
    color: #aaa;
    font-size: 0.8rem;
    padding: 16px;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>🌸 Falcon Farms — Plan de Producción</h1>
    <small>California Torre de Control</small>
  </div>
</div>

<div class="login-wrap">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    <p class="sub">Ingresa tus credenciales para acceder al plan</p>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Usuario</label>
        <input type="text" class="form-control" id="username" placeholder="Tu usuario" autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">
        <span id="btnText">Entrar</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
      </button>
      <div class="alert alert-danger alert-box" id="errorBox"></div>
    </form>
  </div>
</div>

<footer>Falcon Farms California &copy; 2024</footer>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btnLogin');
  const spinner = document.getElementById('btnSpinner');
  const errBox = document.getElementById('errorBox');

  btn.disabled = true;
  spinner.classList.remove('d-none');
  errBox.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) {
      errBox.textContent = data.detail || 'Error al iniciar sesión';
      errBox.style.display = 'block';
      return;
    }
    localStorage.setItem('token', data.token);
    localStorage.setItem('username', data.username);
    localStorage.setItem('is_admin', data.is_admin ? '1' : '0');
    window.location.href = '/app';
  } catch(err) {
    errBox.textContent = 'Error de conexión. Intenta de nuevo.';
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    spinner.classList.add('d-none');
  }
});

// Redirect if already logged in
if (localStorage.getItem('token')) {
  window.location.href = '/app';
}
</script>
</body>
</html>
