<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración — Falcon Farms</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --navy:#1F3864; }
  body { background:#f0f2f5; font-family:Arial,sans-serif; }
  .top-nav { background:var(--navy); color:#fff; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; }
  .top-nav h1 { font-size:1.1rem; font-weight:700; margin:0; }
  .card { border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  .badge-admin { background:#1F3864; color:#fff; }
</style>
</head>
<body>

<div class="top-nav">
  <h1>⚙ Administración de Usuarios — Falcon Farms</h1>
  <div style="display:flex;gap:16px;font-size:0.85rem">
    <a href="/app" class="text-light text-decoration-none">← Volver al Plan</a>
    <a href="#" onclick="logout()" class="text-light text-decoration-none">Salir</a>
  </div>
</div>

<div class="container py-4" style="max-width:800px">

  <!-- CREATE USER -->
  <div class="card mb-4">
    <div class="card-header" style="background:var(--navy);color:#fff;font-weight:700">
      ➕ Crear Nuevo Usuario
    </div>
    <div class="card-body">
      <form id="createForm" class="row g-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold">Usuario</label>
          <input type="text" class="form-control" id="newUsername" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <input type="password" class="form-control" id="newPassword" required>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="newIsAdmin">
            <label class="form-check-label" for="newIsAdmin">Admin</label>
          </div>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-success w-100">Crear</button>
        </div>
      </form>
      <div id="createMsg" class="mt-2"></div>
    </div>
  </div>

  <!-- USER LIST -->
  <div class="card">
    <div class="card-header" style="background:var(--navy);color:#fff;font-weight:700">
      👥 Usuarios Registrados
    </div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Creado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr><td colspan="4" class="text-center text-muted py-3">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- IMPORT LOG -->
  <div class="card mt-4">
    <div class="card-header" style="background:var(--navy);color:#fff;font-weight:700">
      📋 Historial de Importaciones
    </div>
    <div class="card-body p-0">
      <table class="table table-sm mb-0">
        <thead class="table-light">
          <tr><th>Fecha</th><th>Usuario</th><th>Desde</th><th>Hasta</th><th>+Nuevas</th><th>~Actualiz.</th><th>-Eliminadas</th></tr>
        </thead>
        <tbody id="importLogBody">
          <tr><td colspan="7" class="text-center text-muted py-3">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- CHANGE PASSWORD MODAL -->
<div class="modal fade" id="pwModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Cambiar Contraseña</h5></div>
      <div class="modal-body">
        <input type="hidden" id="pwUserId">
        <label class="form-label">Nueva contraseña</label>
        <input type="password" class="form-control" id="pwNewPass">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="changePassword()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token   = localStorage.getItem('token');
const isAdmin = localStorage.getItem('is_admin') === '1';
if (!token || !isAdmin) window.location.href = '/';

function logout() { localStorage.clear(); window.location.href = '/'; }
function authHeaders() { return { 'Content-Type':'application/json', 'Authorization':'Bearer '+token }; }

async function loadUsers() {
  const res = await fetch('/api/users', { headers: authHeaders() });
  if (res.status === 401) { logout(); return; }
  const users = await res.json();
  const me = localStorage.getItem('username');
  const tbody = document.getElementById('userTableBody');
  tbody.innerHTML = users.map(u => `
    <tr>
      <td><strong>${u.username}</strong> ${u.username===me?'<span class="badge bg-success">Tú</span>':''}</td>
      <td><span class="badge ${u.is_admin?'badge-admin':'bg-secondary'}">${u.is_admin?'Admin':'Usuario'}</span></td>
      <td>${u.created_at?u.created_at.substring(0,10):''}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1" onclick="openPwModal(${u.id})">🔑 Contraseña</button>
        ${u.username!==me?`<button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id},'${u.username}')">🗑 Eliminar</button>`:''}
      </td>
    </tr>
  `).join('') || '<tr><td colspan="4" class="text-center text-muted">No hay usuarios</td></tr>';
}

async function loadImportLog() {
  const res = await fetch('/api/import/log', { headers: authHeaders() });
  const logs = await res.json();
  const tbody = document.getElementById('importLogBody');
  tbody.innerHTML = logs.map(l => `
    <tr>
      <td>${l.imported_at?l.imported_at.substring(0,19).replace('T',' '):''}</td>
      <td>${l.imported_by||''}</td>
      <td>${l.date_from||''}</td>
      <td>${l.date_to||''}</td>
      <td class="text-success">+${l.rows_added||0}</td>
      <td class="text-warning">~${l.rows_updated||0}</td>
      <td class="text-danger">-${l.rows_deleted||0}</td>
    </tr>
  `).join('') || '<tr><td colspan="7" class="text-center text-muted">Sin historial</td></tr>';
}

document.getElementById('createForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const username  = document.getElementById('newUsername').value.trim();
  const password  = document.getElementById('newPassword').value;
  const is_admin  = document.getElementById('newIsAdmin').checked;
  const msgEl = document.getElementById('createMsg');
  msgEl.innerHTML = '';

  const res = await fetch('/api/users', {
    method:'POST', headers:authHeaders(),
    body: JSON.stringify({username, password, is_admin})
  });
  const data = await res.json();
  if (!res.ok) {
    msgEl.innerHTML = `<div class="alert alert-danger">${data.detail}</div>`;
  } else {
    msgEl.innerHTML = `<div class="alert alert-success">Usuario "${username}" creado exitosamente</div>`;
    document.getElementById('createForm').reset();
    loadUsers();
    setTimeout(() => msgEl.innerHTML='', 3000);
  }
});

function openPwModal(id) {
  document.getElementById('pwUserId').value = id;
  document.getElementById('pwNewPass').value = '';
  new bootstrap.Modal(document.getElementById('pwModal')).show();
}

async function changePassword() {
  const id = document.getElementById('pwUserId').value;
  const pw = document.getElementById('pwNewPass').value;
  if (!pw) { alert('Ingresa una contraseña'); return; }
  await fetch(`/api/users/${id}`, {
    method:'PUT', headers:authHeaders(),
    body: JSON.stringify({password: pw})
  });
  bootstrap.Modal.getInstance(document.getElementById('pwModal')).hide();
  alert('Contraseña actualizada');
}

async function deleteUser(id, name) {
  if (!confirm(`¿Eliminar al usuario "${name}"?`)) return;
  const res = await fetch(`/api/users/${id}`, { method:'DELETE', headers:authHeaders() });
  if (res.ok) { loadUsers(); }
  else { const d = await res.json(); alert(d.detail); }
}

loadUsers();
loadImportLog();
</script>
</body>
</html>
